<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in or sign up</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#5b6478;--line:#d5dbe6;--accent:#2b59ff;--accent-ink:#fff;--err:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#eef1fa;--mute:#9aa5c0;--line:#2b3556;--accent:#6f8fff;--accent-ink:#0e1424;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#eef1fa;--mute:#9aa5c0;--line:#2b3556;--accent:#6f8fff;--accent-ink:#0e1424;--err:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.social{display:grid;gap:10px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.sbtn:hover{background:var(--bg)}
.sbtn svg{width:20px;height:20px;flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.85rem;margin:20px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:.9rem;font-weight:600;margin:0 0 14px}
input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;margin-top:4px}
.err{color:var(--err);font-size:.9rem;min-height:1.3em;margin:0 0 8px}
.switch{text-align:center;color:var(--mute);margin:18px 0 0;font-size:.95rem}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.6rem;font-weight:700;margin:0 auto 14px}
.acct{text-align:center}
.acct .sub{margin-bottom:22px}
.note{font-size:.8rem;color:var(--mute);margin:16px 0 0;text-align:center}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#2b59ff;left:-12vmax;top:-14vmax}
.bg i:nth-child(2){background:#9b5cff;right:-14vmax;top:10vmax;animation-duration:23s;animation-delay:-6s}
.bg i:nth-child(3){background:#19c2b0;left:18vw;bottom:-20vmax;animation-duration:27s;animation-delay:-11s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.15)}100%{transform:translate(-6vw,12vh) scale(.95)}}
.card{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--card) 82%,transparent);box-shadow:0 30px 80px -30px rgba(20,33,61,.45)}
.flip-in{animation:flip .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(-16deg) translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*65ms + 180ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
input{transition:border-color .2s,box-shadow .2s,transform .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);outline:none;transform:translateY(-1px)}
.sbtn{transition:transform .2s,background .2s,box-shadow .2s}
.sbtn:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px rgba(20,33,61,.5)}
.sbtn:active,.primary:active{transform:scale(.97)}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.socials .sbtn{flex-direction:column;gap:6px;padding:14px 8px;font-size:.85rem}
.primary{position:relative;overflow:hidden;transition:transform .2s,background .3s}
.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out 1.4s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.primary.done{background:#1faa59;color:#fff;animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.04)}}
.err:not(:empty){animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.avatar{position:relative;animation:pop .7s cubic-bezier(.3,1.6,.5,1) .15s both}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:ring 2s ease-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.rise{opacity:1}}
.flip-in{animation-delay:var(--d,0s)}
.rise{animation-delay:calc(var(--i)*65ms + 180ms + var(--d,0s))}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:14px;background:linear-gradient(135deg,#14213d,#2b59ff 60%,#9b5cff);color:#fff;animation:splashout .7s ease 1.7s forwards}
.splash svg{width:96px;height:96px}
.splash circle{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:283;stroke-dashoffset:283;animation:draw 1.1s ease .2s forwards}
.splash path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s ease 1s forwards}
.splash p{margin:0;font-size:1.3rem;font-weight:700;opacity:0;animation:rise .6s ease .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes splashout{to{opacity:0;transform:scale(1.15);visibility:hidden}}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,15,30,.5);animation:fade .3s both}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;animation:slideup .45s cubic-bezier(.2,.9,.3,1) both}
@media(min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sheet-h svg{width:26px;height:26px}.sheet-h h2{font-size:1.15rem;margin:0;flex:1}
.x{background:none;border:0;color:var(--mute);font-size:1.6rem;cursor:pointer;line-height:1}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;opacity:0;animation:rise .45s forwards;animation-delay:calc(var(--i)*80ms + 200ms)}
.acc:hover{background:var(--bg)}.acc small{display:block;color:var(--mute)}
.ava{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:26px auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0}}@keyframes slideup{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.splash{display:none}.acc{opacity:1}}
#app:empty{display:none}
.splash{animation:none;gap:10px}
.splash.out{animation:splashout .6s ease forwards}
.splash .ring{position:relative;width:150px;height:150px;margin-bottom:10px}
.splash svg{width:150px;height:150px}
.splash .trk{fill:none;stroke:rgba(255,255,255,.25);stroke-width:4;stroke-dashoffset:0;animation:none}
.splash .prg{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:50% 50%;animation:cd 10s linear forwards}
@keyframes cd{to{stroke-dashoffset:283}}
.cnt{position:absolute;inset:0;display:grid;place-items:center;font-size:3.4rem;font-weight:700;animation:tick .6s ease}
@keyframes tick{from{transform:scale(1.5);opacity:.2}to{transform:none;opacity:1}}
.splash .msg{font-weight:400;font-size:1rem;opacity:.85}
.skip{margin-top:18px;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:8px 22px;font:inherit;cursor:pointer}
.skip:hover{background:rgba(255,255,255,.15)}
.splash{display:block;background:#060916;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
.splash .cap{position:absolute;left:0;right:0;bottom:16%;text-align:center;margin:0;font-size:1.1rem;font-weight:400;letter-spacing:.04em;opacity:0;animation:none;color:#c8d3ff}
.splash .cap.on{animation:capin 3s ease forwards}
@keyframes capin{0%{opacity:0;transform:translateY(10px);filter:blur(6px)}20%,80%{opacity:.95;transform:none;filter:none}100%{opacity:0;filter:blur(4px)}}
.fin{position:absolute;inset:0;pointer-events:none;opacity:0}
.fin.show{opacity:1}
.wel{position:absolute;left:0;right:0;text-align:center;line-height:1;font-weight:800;transform:translateY(-50%);background:linear-gradient(90deg,#7fc8ff,#b48cff,#ff8fc7,#ffd27f,#7fc8ff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(150,140,255,.65))}
.fin.show .wel{animation:wel 1.1s cubic-bezier(.2,.9,.3,1.3) both,sheen 3s linear infinite}
@keyframes wel{from{opacity:0;transform:translateY(-50%) scale(.6)}to{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes sheen{to{background-position:250% 0}}
.emo{position:absolute;left:0;right:0;text-align:center;line-height:1}
.fin.show .emo{animation:emo 1s cubic-bezier(.3,1.7,.5,1) .35s both,bob 1.4s ease-in-out 1.4s infinite}
@keyframes emo{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.splash .skip{position:absolute;right:18px;bottom:18px;margin:0;opacity:.55;z-index:2}
</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Welcome"><canvas id="cv"></canvas><p class="cap" id="cap"></p><div class="fin" id="fin"><div class="wel" id="wel">Welcome</div><div class="emo" id="emo">🤗</div></div><button class="skip" id="skip">Skip</button></div>
<div class="bg"><i></i><i></i><i></i></div>
<main class="card" id="app"></main>

<script>
const ICONS={
google:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>',
apple:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>',
x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
telegram:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#27A7E7"/><path fill="#fff" d="M5.4 11.8l11.2-4.3c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.9-2.1-1.4 1.4c-.2.2-.3.3-.6.3l.2-3 5.4-4.9c.2-.2 0-.3-.4-.1l-6.7 4.2-2.9-.9c-.6-.2-.6-.6.2-.9z"/></svg>'};
const PROVIDERS=[["google","Google"],["apple","Apple"],["x","X (Twitter)"],["telegram","Telegram"]];
const app=document.getElementById("app");
let view="login",msg="";

function getSession(){try{return JSON.parse(localStorage.getItem("session"))}catch(e){return null}}
function setSession(s){try{s?localStorage.setItem("session",JSON.stringify(s)):localStorage.removeItem("session")}catch(e){}window._s=s}
window._s=getSession();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let first=true;
const ACC={Google:["Rahim Uddin|rahim.uddin@gmail.com","Nusrat Jahan|nusrat.jahan@gmail.com","Office|office.demo@gmail.com"],Apple:["Rahim Uddin|rahim@icloud.com","Hide my email|relay.x7f2@privaterelay.appleid.com"],"X (Twitter)":["Rahim Uddin|@rahim_ud","My brand|@my_brand"]};
function closeSheet(){document.querySelectorAll(".sheet-wrap").forEach(e=>e.remove())}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function openSheet(n){
  const k=PROVIDERS.find(p=>p[1]===n)[0];closeSheet();
  const w=document.createElement("div");w.className="sheet-wrap";
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h">${ICONS[k]}<h2>${n==="Telegram"?"Log in with Telegram":"Choose an account"}</h2><button class="x" aria-label="Close">×</button></div><div id="sb"></div></div>`;
  document.body.appendChild(w);
  w.onclick=e=>{if(e.target===w)closeSheet()};
  w.querySelector(".x").onclick=closeSheet;
  const sb=w.querySelector("#sb"),q=s=>sb.querySelector(s);
  const pick=(name,id)=>{sb.innerHTML=`<div class="spin"></div><p class="sub" style="text-align:center">Signing in with ${esc(n)}…</p>`;
    setTimeout(()=>{closeSheet();setSession({name,username:id.replace(/^@/,"").split("@")[0].replace(/\W/g,"_"),provider:n});render()},1000)};
  if(n==="Telegram"){
    sb.innerHTML=`<p class="sub">Enter your phone number. Telegram will send you a code.</p><label>Phone number<input id="ph" type="tel" placeholder="+880 1XXX XXXXXX"></label><p class="err" id="pe"></p><button class="primary" id="pg">Send code</button>`;
    q("#pg").onclick=()=>{const p=q("#ph").value.trim();
      if(p.replace(/\D/g,"").length<8)return q("#pe").textContent="Enter a valid phone number.";
      sb.innerHTML=`<p class="sub">Enter the 5-digit code sent to ${esc(p)} in Telegram.</p><label>Code<input id="cd" inputmode="numeric" maxlength="5" placeholder="12345"></label><p class="err" id="pe"></p><button class="primary" id="cg">Log in</button>`;
      q("#cg").onclick=()=>{if(!/^\d{5}$/.test(q("#cd").value))return q("#pe").textContent="Enter the 5-digit code.";pick("Telegram user","tg_"+p.replace(/\D/g,"").slice(-4))};
    };
    return;
  }
  const list=ACC[n].map(x=>x.split("|"));
  sb.innerHTML=`<p class="sub">to continue to the app</p>`+list.map(([a,b],i)=>`<button class="acc" style="--i:${i}" data-a="${esc(a)}" data-b="${esc(b)}"><span class="ava">${esc(a[0])}</span><span><b>${esc(a)}</b><small>${esc(b)}</small></span></button>`).join("")+`<button class="acc" id="oth" style="--i:${list.length}"><span class="ava">+</span><span><b>Use another account</b></span></button><div id="ox"></div><p class="note">Demo accounts. A website cannot read the accounts saved on your phone.</p>`;
  sb.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>pick(b.dataset.a,b.dataset.b));
  q("#oth").onclick=()=>{q("#ox").innerHTML=`<label style="margin-top:12px">${n==="X (Twitter)"?"Username":"Email"}<input id="ot"></label><button class="primary" id="og">Continue</button>`;
    q("#ot").focus();q("#og").onclick=()=>{const v=q("#ot").value.trim();if(v)pick(v,v)}};
}
function render(){
  const s=window._s;
  app.style.setProperty("--d","0s");first=false;app.classList.remove("flip-in");void app.offsetWidth;app.classList.add("flip-in");
  let i=0;const a=c=>`class="rise ${c||""}" style="--i:${i++}"`;
  if(s){
    app.innerHTML=`<div class="acct"><div class="avatar">${esc(s.name[0].toUpperCase())}</div>
      <h1 ${a()}>Welcome, ${esc(s.name)}</h1>
      <p ${a("sub")}>${s.username?"@"+esc(s.username)+" · ":""}${s.provider?"Signed in with "+esc(s.provider):esc(s.email||"")}</p>
      <button ${a("primary")} id="out">Log out</button></div>`;
    document.getElementById("out").onclick=()=>{setSession(null);view="login";msg="You have been logged out.";render()};
    return;
  }
  const su=view==="signup";
  app.innerHTML=`<h1 ${a()}>${su?"Create your account":"Log in"}</h1>
    <p ${a("sub")}>${su?"Sign up in a few seconds.":"Welcome back."}</p>
    <form id="f" novalidate>
      ${su?`<label ${a()}>Name<input id="name" autocomplete="name" required></label>
      <label ${a()}>Username<input id="user" autocomplete="username" required></label>
      <label ${a()}>Email<input id="email" type="email" autocomplete="email" required></label>`
      :`<label ${a()}>Username or email<input id="id" autocomplete="username" required></label>`}
      <label ${a()}>Password<input id="pw" type="password" autocomplete="${su?"new-password":"current-password"}" minlength="8" required></label>
      <p class="err" id="err" role="alert">${esc(msg)}</p>
      <button ${a("primary")} id="go" type="submit">${su?"Sign up":"Log in"}</button>
    </form>
    <div ${a("or")}>or ${su?"sign up":"continue"} with</div>
    <div class="socials">${PROVIDERS.map(([k,n])=>`<button type="button" ${a("sbtn")} data-n="${n}">${ICONS[k]}<span>${n}</span></button>`).join("")}</div>
    <p ${a("switch")}>${su?"Already have an account?":"New here?"} <button class="link" id="sw">${su?"Log in":"Sign up"}</button></p>
    <p class="note">Demo page: sign-in is simulated in this browser only.</p>`;
  msg="";
  const finish=(sess,btn)=>{btn.classList.add("done");btn.textContent="✓ Welcome!";setTimeout(()=>{setSession(sess);render()},650)};
  document.getElementById("sw").onclick=()=>{view=su?"login":"signup";render()};
  app.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>openSheet(b.dataset.n));
  document.getElementById("f").onsubmit=e=>{
    e.preventDefault();
    const v=id=>(document.getElementById(id)?.value||"").trim(),err=document.getElementById("err"),pw=v("pw");
    const bad=t=>{err.textContent="";void err.offsetWidth;err.textContent=t};
    if(su){
      if(!v("name"))return bad("Enter your name.");
      if(!/^\w{3,20}$/.test(v("user")))return bad("Username: 3-20 letters, numbers or _.");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email")))return bad("Enter a valid email address.");
    }else if(!v("id"))return bad("Enter your username or email.");
    if(pw.length<8)return bad("Password must be at least 8 characters.");
    const idv=v("id");
    finish(su?{name:v("name"),username:v("user"),email:v("email")}:{name:idv.split("@")[0],username:idv.includes("@")?idv.split("@")[0]:idv,email:idv.includes("@")?idv:""},document.getElementById("go"));
  };
  document.querySelector("input")?.focus({preventScroll:true});
}
(function(){
  const $=id=>document.getElementById(id),sp=$("splash"),cv=$("cv"),cap=$("cap"),fin=$("fin"),wel=$("wel"),emo=$("emo"),ctx=cv.getContext("2d");
  const FONT='"Segoe UI",system-ui,-apple-system,Roboto,sans-serif';
  const CAPS=[[.5,"Hello…"],[3.8,"Gathering everything for you…"],[7.4,""]];
  const D=Math.min(devicePixelRatio||1,2),END=14.6;
  let W,H,fs=80,P=[],T=[],t0=null,done=false,burst=false,f2=false,flash=0,ci=-1,raf;
  function size(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
  function targets(){
    const o=document.createElement("canvas"),c=o.getContext("2d");
    c.font="800 100px "+FONT;fs=Math.min(W*.84/c.measureText("Welcome").width*100,150);
    o.width=W;o.height=H;c.font="800 "+fs+"px "+FONT;c.textAlign="center";c.textBaseline="middle";c.fillStyle="#fff";
    const cy=H/2-fs*.15;c.fillText("Welcome",W/2,cy);
    const d=c.getImageData(0,0,W,H).data,s=Math.max(3,Math.round(fs/26));T=[];
    for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s)if(d[(y*W+x)*4+3]>128)T.push({x,y});
    for(let i=T.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[T[i],T[j]]=[T[j],T[i]]}
    P.forEach((p,i)=>p.ti=T.length>=P.length?Math.floor(i*T.length/P.length):(i<T.length?i:-1));
    wel.style.fontSize=fs+"px";wel.style.top=cy+"px";emo.style.fontSize=fs*.85+"px";emo.style.top=(H/2+fs*.6)+"px";
  }
  function init(){
    const n=Math.min(1800,Math.max(700,Math.floor(W*H/900)));P=[];
    for(let i=0;i<n;i++){const a=Math.random()*6.283,r=Math.random()*Math.max(W,H)*.6;
      P.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:0,vy:0,h:Math.random()*360,s:Math.random()*1.6+.8,ph:Math.random()*6.283,ti:-1})}
  }
  function end(){if(done)return;done=true;cancelAnimationFrame(raf);sp.classList.add("out");setTimeout(()=>sp.remove(),650);render()}
  function frame(ts){
    if(done)return;if(!t0)t0=ts;const t=(ts-t0)/1000,cx=W/2,cy=H/2;
    ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
    ctx.fillStyle="rgba(6,9,22,"+(t<11?.18:.25)+")";ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    if(t<7.2){const r=60+t*14+Math.sin(t*3)*8,g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,"rgba(140,170,255,"+Math.min(.9,.25+t*.09)+")");g.addColorStop(1,"rgba(140,170,255,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.fill()}
    if(t>=7.2&&!f2){f2=true;flash=.8}
    if(t>=11&&!burst){burst=true;flash=1;fin.classList.add("show");
      for(const p of P){const a=Math.random()*6.283,s=3+Math.random()*9;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s-2;p.s*=1.3}}
    ctx.globalAlpha=t<11?1:Math.max(0,1-(t-11)/3);
    for(const p of P){
      p.h+=.4;
      if(t<3.5){const a=Math.sin(p.ph+t*.8+p.y*.004)*6.283;
        p.vx+=Math.cos(a)*.03+(cx-p.x)*.00008;p.vy+=Math.sin(a)*.03+(cy-p.y)*.00008;p.vx*=.97;p.vy*=.97}
      else if(t<7.2){const k=(t-3.5)/3.7,dx=cx-p.x,dy=cy-p.y,d=Math.hypot(dx,dy)+.01,pull=.05*(.3+k),sw=.14*(1.2-k*.4);
        p.vx+=dx/d*pull-dy/d*sw;p.vy+=dy/d*pull+dx/d*sw;p.vx*=.96;p.vy*=.96}
      else if(t<11){
        if(p.ti>=0){const q=T[p.ti],k=Math.min(.14,.02+(t-7.2)*.03);
          p.x+=(q.x-p.x)*k+Math.sin(t*6+p.ph)*.25;p.y+=(q.y-p.y)*k+Math.cos(t*5+p.ph)*.25;p.vx=p.vy=0}
        else{p.vx+=(p.x-cx)*.0003;p.vy+=(p.y-cy)*.0003}}
      else{p.vy+=.12;p.vx*=.99}
      p.x+=p.vx;p.y+=p.vy;
      ctx.fillStyle="hsl("+p.h%360+",90%,65%)";ctx.fillRect(p.x,p.y,p.s*1.4,p.s*1.4);
    }
    ctx.globalAlpha=1;
    if(flash>.01){ctx.globalCompositeOperation="source-over";ctx.fillStyle="rgba(255,255,255,"+flash*.6+")";ctx.fillRect(0,0,W,H);flash*=.9}
    let k=-1;CAPS.forEach((c,i)=>{if(t>=c[0])k=i});
    if(k!==ci){ci=k;cap.classList.remove("on");void cap.offsetWidth;cap.textContent=CAPS[k][1];if(CAPS[k][1])cap.classList.add("on")}
    if(t>=END)return end();
    raf=requestAnimationFrame(frame);
  }
  $("skip").onclick=end;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return end();
  size();init();targets();
  addEventListener("resize",()=>{if(!done){size();targets()}});
  raf=requestAnimationFrame(frame);
})();
</script>
</body>
